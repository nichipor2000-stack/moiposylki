<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Сканер посылок</title>
<meta name="theme-color" content="#a855f7">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#16121f;--card:#221b30;--border:#3a2f52;--accent:#a855f7;--accent2:#c084fc;--text:#f0eaff;--text2:#b8a9d9;--text3:#7a6b9e;--green:#4ade80;--yellow:#fbbf24;--blue:#60a5fa;--orange:#fb923c;--red:#f87171}
body.light{--bg:#f5f3fb;--card:#fff;--border:#e0d5f0;--text:#1a1428;--text2:#4a3d6b;--text3:#8b7ca8}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.container{max-width:600px;margin:0 auto;padding:16px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.top-bar h1{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.icon-btn{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0}
.screen{display:none}.screen.active{display:block}
.menu{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 2px 12px;z-index:100}
.menu-item{flex:1;text-align:center;padding:8px 2px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;border-radius:10px;user-select:none}
.menu-item .ico{font-size:20px;display:block;margin-bottom:3px;filter:grayscale(1) opacity(.5)}
.menu-item.active{color:var(--accent2);background:rgba(168,85,247,.12)}
.menu-item.active .ico{filter:none}
.form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.form h2{font-size:15px;color:var(--accent2);margin-bottom:12px;font-weight:700}
input,select,textarea{width:100%;padding:13px 14px;border-radius:11px;font-size:15px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:10px;font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--text3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
button{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 4px 14px rgba(168,85,247,.3);margin-bottom:8px}
button:active{opacity:.85}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text2);box-shadow:none}
button.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}
button.green{background:linear-gradient(135deg,#22c55e,#15803d)}
.total{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;padding:18px;text-align:center;margin-bottom:16px}
.total .lbl{font-size:11px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px}
.total .val{font-size:28px;font-weight:900;color:white;margin:4px 0}
.total .sub{font-size:13px;color:rgba(255,255,255,.9);margin-top:6px}
.pkg-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid var(--accent);position:relative}
.pkg-card.has-track{border-left-color:var(--green)}
.pkg-card.no-track{border-left-color:var(--red)}
.pkg-card.unknown{border-left-color:var(--accent)}
.pkg-track{font-size:16px;font-weight:800;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pkg-status{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.status-btn{width:36px;height:36px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text3);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin:0;box-shadow:none;font-weight:800}
.status-btn:active{transform:scale(.95)}
.status-btn.valid.active{background:rgba(74,222,128,.2);border-color:var(--green);color:var(--green)}
.status-btn.invalid.active{background:rgba(248,113,113,.2);border-color:var(--red);color:var(--red)}
.pkg-info{font-size:13px;color:var(--text2);line-height:1.6}
.pkg-info b{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.pkg-row{display:flex;justify-content:space-between;padding:4px 0;gap:8px}
.pkg-actions{display:flex;gap:6px;margin-top:10px}
.pkg-actions button{width:auto;padding:8px 14px;font-size:13px;margin:0;flex:1}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:250px;border:2px solid var(--border);margin-bottom:12px}
.result{margin-top:12px}
.result .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;border-left:4px solid var(--green)}
.result .card.notfound{border-left-color:var(--red)}
.search-box{position:relative;margin-bottom:14px}
.search-box input{padding-left:42px;padding-right:44px;background:var(--card);margin:0}
.search-box .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--border);color:var(--text);font-size:14px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.search-clear.visible{display:flex}
.filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.filter-chip{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none}
.filter-chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-color:transparent}
.empty{text-align:center;color:var(--text3);padding:40px 20px;font-size:14px;background:var(--card);border:1px dashed var(--border);border-radius:16px}
.formula{text-align:center;color:var(--text3);font-size:12px;margin-top:6px;line-height:1.6}
.field-label{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:5px;margin-top:4px;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 input{margin-bottom:10px}
.archive-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.archive-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.archive-card .month{font-size:18px;font-weight:800;color:var(--accent2)}
.archive-card .stats{font-size:12px;color:var(--text3);display:flex;gap:12px;flex-wrap:wrap}
.archive-card .stats b{color:var(--text2)}
.close-month-box{background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:16px;padding:16px;margin-bottom:16px;text-align:center}
.close-month-box h3{font-size:16px;color:white;margin-bottom:8px}
.close-month-box p{font-size:12px;color:rgba(255,255,255,.85);margin-bottom:12px;line-height:1.5}
.close-month-box button{background:white;color:#7c3aed;font-weight:800;margin:0}
.archive-pkg{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px}
.archive-pkg .track{font-weight:800;color:var(--accent2);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:400px;width:100%;border:1px solid var(--border);max-height:80vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:10px;color:var(--accent2)}
.modal p{font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.5}
</style>
</head>
<body>

<div class="container">

  <!-- СКАНЕР -->
  <div class="screen active" id="screen-scan">
    <div class="top-bar">
      <h1>📷 Сканер посылок</h1>
      <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    </div>
    <div id="reader"></div>
    <div class="result" id="result"></div>
  </div>

  <!-- ПОСЫЛКИ -->
  <div class="screen" id="screen-list">
    <div class="top-bar">
      <h1>📋 Посылки</h1>
      <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="search-box">
      <span class="ico">🔍</span>
      <input id="searchInput" placeholder="Поиск по треку, имени, товару..." oninput="onSearchInput()">
      <div class="search-clear" id="searchClear" onclick="clearSearch()">✕</div>
    </div>

    <div class="filter-row" id="filterRow">
      <div class="filter-chip active" onclick="setFilter('all',this)">Все</div>
      <div class="filter-chip" onclick="setFilter('has',this)">✅ Есть трек</div>
      <div class="filter-chip" onclick="setFilter('no',this)">❌ Нет трека</div>
      <div class="filter-chip" onclick="setFilter('unknown',this)">❔ Не отмечено</div>
    </div>

    <button class="green" onclick="openAddForm()">➕ Добавить посылку</button>

    <div id="pkgList"></div>
  </div>

  <!-- ДОБАВИТЬ / РЕДАКТИРОВАТЬ -->
  <div class="screen" id="screen-form">
    <div class="top-bar">
      <h1 id="formTitle">➕ Новая посылка</h1>
      <button class="icon-btn" onclick="goBack()">←</button>
    </div>
    <div class="form">
      <span class="field-label">Трек-номер *</span>
      <input id="f-track" placeholder="например RU123456789" autocomplete="off">

      <span class="field-label">Кто заказал *</span>
      <input id="f-person" placeholder="Имя клиента" autocomplete="off">

      <div class="row2">
        <div>
          <span class="field-label">Вес (кг)</span>
          <input id="f-weight" type="number" step="0.01" inputmode="decimal" placeholder="6">
        </div>
        <div>
          <span class="field-label">Сумма в ¥</span>
          <input id="f-yuan" type="number" step="0.01" inputmode="decimal" placeholder="270">
        </div>
      </div>

      <span class="field-label">📦 Что внутри</span>
      <input id="f-desc" placeholder="Кроссовки, куртка..." autocomplete="off">

      <button onclick="savePackage()" id="formSaveBtn">💾 Сохранить</button>
    </div>
  </div>

  <!-- АРХИВ -->
  <div class="screen" id="screen-archive">
    <div class="top-bar">
      <h1>📚 Архив</h1>
      <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="close-month-box">
      <h3>🔒 Закрыть текущий месяц</h3>
      <p>Все посылки уйдут в архив. Список обнулится.</p>
      <button onclick="closeMonth()">📦 Закрыть месяц</button>
    </div>

    <div id="archiveList"></div>
  </div>

  <!-- ПРОСМОТР АРХИВА -->
  <div class="screen" id="screen-archive-view">
    <div class="top-bar">
      <h1 id="archiveViewTitle">Архив</h1>
      <button class="icon-btn" onclick="switchScreen('archive')">←</button>
    </div>
    <div id="archiveDetails"></div>
  </div>

</div>

<div class="menu">
  <div class="menu-item active" data-screen="scan" onclick="switchScreen('scan')"><span class="ico">📷</span>Скан</div>
  <div class="menu-item" data-screen="list" onclick="switchScreen('list')"><span class="ico">📋</span>Посылки</div>
  <div class="menu-item" data-screen="archive" onclick="switchScreen('archive')"><span class="ico">📚</span>Архив</div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">—</h3>
    <div id="modalText"></div>
    <button onclick="closeModal()">Понятно</button>
  </div>
</div>

<script>
const KEY='scanner_pkgs_v2';
const ARCHIVE_KEY='scanner_archive_v2';
const THEME_KEY='scanner_theme_v2';
const MONTH_NAMES=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

let currentId=null;
let activeFilter='all';
let scanner=null;
let scannerRunning=false;
let lastScan={code:'',time:0};

// ============ ДАННЫЕ ============
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function loadArchive(){try{return JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'{}')}catch(e){return{}}}
function saveArchive(a){localStorage.setItem(ARCHIVE_KEY,JSON.stringify(a))}

// ============ НАВИГАЦИЯ ============
function switchScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
  const s=document.getElementById('screen-'+name);if(s)s.classList.add('active');
  const item=document.querySelector('.menu-item[data-screen="'+name+'"]');if(item)item.classList.add('active');
  window.scrollTo(0,0);
  if(name==='scan')startScanner();
  else stopScanner();
  if(name==='list')renderList();
  if(name==='archive')renderArchive();
}

function goBack(){switchScreen('list')}

function toggleTheme(){
  document.body.classList.toggle('light');
  localStorage.setItem(THEME_KEY,document.body.classList.contains('light')?'light':'dark');
}
function loadTheme(){
  if((localStorage.getItem(THEME_KEY)||'dark')==='light')document.body.classList.add('light');
}

// ============ ПОИСК ============
function onSearchInput(){
  const v=document.getElementById('searchInput').value;
  const b=document.getElementById('searchClear');
  if(v.length>0)b.classList.add('visible');else b.classList.remove('visible');
  renderList();
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('visible');
  renderList();
  document.getElementById('searchInput').focus();
}
function setFilter(f,el){
  activeFilter=f;
  document.querySelectorAll('#filterRow .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// ============ СПИСОК ============
function renderList(){
  const data=load();
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  let filtered=data.slice();
  if(q)filtered=filtered.filter(p=>
    (p.track||'').toLowerCase().includes(q)||
    (p.person||'').toLowerCase().includes(q)||
    (p.desc||'').toLowerCase().includes(q)
  );
  if(activeFilter!=='all')filtered=filtered.filter(p=>(p.status||'unknown')===activeFilter);

  const el=document.getElementById('pkgList');
  if(!data.length){
    el.innerHTML='<div class="empty">Пока нет посылок.<br>Нажми ➕ Добавить посылку</div>';
    return;
  }
  if(!filtered.length){
    el.innerHTML='<div class="empty">Ничего не найдено</div>';
    return;
  }
  el.innerHTML=filtered.map(p=>{
    const st=p.status||'unknown';
    const cls=st==='has'?'has-track':(st==='no'?'no-track':'unknown');
    return '<div class="pkg-card '+cls+'">'+
      '<div class="pkg-track">'+
        '<span>'+escapeHtml(p.track)+'</span>'+
        '<div class="pkg-status">'+
          '<button class="status-btn valid '+(st==='has'?'active':'')+'" onclick="setStatus('+p.id+',\'has\')" title="Есть трек">✅</button>'+
          '<button class="status-btn invalid '+(st==='no'?'active':'')+'" onclick="setStatus('+p.id+',\'no\')" title="Нет трека">❌</button>'+
        '</div>'+
      '</div>'+
      '<div class="pkg-info">'+
        '<div class="pkg-row"><span><b>Клиент:</b> '+escapeHtml(p.person||'—')+'</span></div>'+
        '<div class="pkg-row"><span><b>Вес:</b> '+((p.weight||0).toFixed(2))+' кг</span><span><b>¥</b> '+((p.yuan||0).toFixed(2))+'</span></div>'+
        (p.desc?'<div class="pkg-row"><span><b>Внутри:</b> '+escapeHtml(p.desc)+'</span></div>':'')+
      '</div>'+
      '<div class="pkg-actions">'+
        '<button class="ghost" onclick="openEditForm('+p.id+')">✏️ Редактировать</button>'+
        '<button class="danger" onclick="deletePackage('+p.id+')">🗑 Удалить</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function setStatus(id,status){
  const data=load();
  const idx=data.findIndex(p=>p.id===id);
  if(idx<0)return;
  // Если нажимаешь на ту же кнопку — снимаем статус
  if(data[idx].status===status)data[idx].status=null;
  else data[idx].status=status;
  save(data);
  renderList();
}

// ============ ДОБАВИТЬ / РЕДАКТИРОВАТЬ ============
function openAddForm(){
  currentId=null;
  document.getElementById('formTitle').textContent='➕ Новая посылка';
  document.getElementById('formSaveBtn').textContent='💾 Сохранить';
  document.getElementById('f-track').value='';
  document.getElementById('f-person').value='';
  document.getElementById('f-weight').value='';
  document.getElementById('f-yuan').value='';
  document.getElementById('f-desc').value='';
  switchScreen('form');
}
function openEditForm(id){
  const p=load().find(x=>x.id===id);if(!p)return;
  currentId=id;
  document.getElementById('formTitle').textContent='✏️ Редактировать';
  document.getElementById('formSaveBtn').textContent='💾 Обновить';
  document.getElementById('f-track').value=p.track||'';
  document.getElementById('f-person').value=p.person||'';
  document.getElementById('f-weight').value=p.weight||'';
  document.getElementById('f-yuan').value=p.yuan||'';
  document.getElementById('f-desc').value=p.desc||'';
  switchScreen('form');
}
function savePackage(){
  const track=document.getElementById('f-track').value.trim().toUpperCase();
  const person=document.getElementById('f-person').value.trim();
  const weight=parseFloat(document.getElementById('f-weight').value)||0;
  const yuan=parseFloat(document.getElementById('f-yuan').value)||0;
  const desc=document.getElementById('f-desc').value.trim();

  if(!track){showModal('⚠️','Введите трек-номер');return}
  if(!person){showModal('⚠️','Введите имя клиента');return}

  const data=load();
  if(currentId){
    const idx=data.findIndex(p=>p.id===currentId);
    if(idx>=0)data[idx]={...data[idx],track,person,weight,yuan,desc};
  }else{
    data.push({id:Date.now(),track,person,weight,yuan,desc,status:null,addedAt:Date.now()});
  }
  save(data);
  switchScreen('list');
}
function deletePackage(id){
  if(!confirm('Удалить посылку?'))return;
  save(load().filter(p=>p.id!==id));
  renderList();
}

// ============ СКАНЕР ============
function startScanner(){
  if(scannerRunning)return;
  const readerEl=document.getElementById('reader');
  if(!readerEl)return;
  scanner=new Html5Qrcode('reader');
  scannerRunning=true;
  scanner.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:280,height:160},
      formatsToSupport:[
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.ITF
      ]
    },
    onScan,
    ()=>{}
  ).catch(err=>{
    scannerRunning=false;
    document.getElementById('result').innerHTML=
      '<div class="card notfound"><h3>⚠️ Камера недоступна</h3><p>'+escapeHtml(String(err))+'</p><p style="margin-top:8px;font-size:12px;color:var(--text3);">Открой через HTTPS (GitHub Pages), не через file://</p></div>';
  });
}
function stopScanner(){
  if(!scanner||!scannerRunning)return;
  scannerRunning=false;
  scanner.stop().then(()=>{scanner.clear();scanner=null;}).catch(()=>{scanner=null;});
}
function onScan(text){
  const now=Date.now();
  if(text===lastScan.code&&now-lastScan.time<2500)return;
  lastScan={code:text,time:now};
  const key=text.toUpperCase().trim();
  const p=load().find(x=>x.track===key);
  const el=document.getElementById('result');
  if(p){
    const st=p.status||'unknown';
    const stLabel=st==='has'?'✅ Есть':(st==='no'?'❌ Нет':'❔ Не отмечено');
    el.innerHTML='<div class="card"><h3 style="color:var(--green);">✅ '+escapeHtml(p.track)+'</h3>'+
      '<div class="pkg-info">'+
        '<div class="pkg-row"><span><b>Клиент:</b> '+escapeHtml(p.person)+'</span></div>'+
        '<div class="pkg-row"><span><b>Вес:</b> '+(p.weight||0).toFixed(2)+' кг</span><span><b>¥:</b> '+(p.yuan||0).toFixed(2)+'</span></div>'+
        (p.desc?'<div class="pkg-row"><span><b>Внутри:</b> '+escapeHtml(p.desc)+'</span></div>':'')+
        '<div class="pkg-row" style="margin-top:8px;"><span><b>Статус:</b> '+stLabel+'</span></div>'+
      '</div>'+
    '</div>';
    if(navigator.vibrate)navigator.vibrate(120);
  }else{
    el.innerHTML='<div class="card notfound"><h3>❓ '+escapeHtml(key)+'</h3><p>Такого трека нет в базе.</p>'+
      '<button class="green" style="margin-top:12px;" onclick="prefillAdd(\''+escapeAttr(key)+'\')">➕ Добавить посылку</button></div>';
    if(navigator.vibrate)navigator.vibrate([80,60,80]);
  }
}
function prefillAdd(track){
  openAddForm();
  document.getElementById('f-track').value=track;
}

// ============ АРХИВ ============
function closeMonth(){
  const data=load();
  if(!data.length){showModal('ℹ️','Нет данных для закрытия');return}
  const now=new Date(),year=now.getFullYear(),month=now.getMonth();
  const key=year+'-'+String(month+1).padStart(2,'0');
  const monthName=MONTH_NAMES[month]+' '+year;
  if(!confirm('Закрыть '+monthName+'?\n\n'+data.length+' посылок уйдут в архив.\nТекущий список обнулится.'))return;
  const archive=loadArchive();
  let fk=key,i=2;while(archive[fk]){fk=key+'_'+i;i++;}
  archive[fk]={
    monthName,
    closedAt:new Date().toISOString(),
    packages:JSON.parse(JSON.stringify(data)),
    count:data.length,
    hasTrack:data.filter(p=>p.status==='has').length,
    noTrack:data.filter(p=>p.status==='no').length
  };
  saveArchive(archive);
  save([]);
  showModal('✅','Месяц «'+monthName+'» закрыт.\nДанные в Архиве 📚');
  renderArchive();
}

function renderArchive(){
  const archive=loadArchive();
  const keys=Object.keys(archive).sort().reverse();
  const el=document.getElementById('archiveList');
  if(!keys.length){el.innerHTML='<div class="empty">Архив пуст.</div>';return}
  el.innerHTML=keys.map(k=>{
    const a=archive[k];
    return '<div class="archive-card" onclick="openArchiveView(\''+k+'\')">'+
      '<div class="head"><div class="month">📅 '+a.monthName+'</div></div>'+
      '<div class="stats">'+
        '<span><b>'+a.count+'</b> посылок</span>'+
        '<span style="color:var(--green)"><b>'+a.hasTrack+'</b> ✅</span>'+
        '<span style="color:var(--red)"><b>'+a.noTrack+'</b> ❌</span>'+
      '</div>'+
    '</div>';
  }).join('');
}

function openArchiveView(key){
  const archive=loadArchive();
  const a=archive[key];if(!a)return;
  document.getElementById('archiveViewTitle').textContent='📅 '+a.monthName;
  const pkgs=a.packages.map(p=>{
    const st=p.status||'unknown';
    const stLabel=st==='has'?'✅ Есть':(st==='no'?'❌ Нет':'❔');
    const color=st==='has'?'var(--green)':(st==='no'?'var(--red)':'var(--text3)');
    return '<div class="archive-pkg">'+
      '<div class="track"><span>'+escapeHtml(p.track)+'</span><span style="color:'+color+';">'+stLabel+'</span></div>'+
      '<div style="color:var(--text2);">👤 '+escapeHtml(p.person)+' · ⚖️ '+(p.weight||0).toFixed(2)+' кг · ¥'+(p.yuan||0).toFixed(2)+'</div>'+
      (p.desc?'<div style="color:var(--text3);font-size:12px;margin-top:3px;">📦 '+escapeHtml(p.desc)+'</div>':'')+
    '</div>';
  }).join('');
  document.getElementById('archiveDetails').innerHTML=
    '<div class="total"><div class="lbl">📅 '+a.monthName+'</div><div class="val">'+a.count+' посылок</div><div class="sub">✅ '+a.hasTrack+' · ❌ '+a.noTrack+'</div></div>'+
    pkgs;
  switchScreen('archive-view');
  document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
  const mi=document.querySelector('.menu-item[data-screen="archive"]');if(mi)mi.classList.add('active');
}

// ============ ХЕЛПЕРЫ ============
function showModal(t,x){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').innerHTML=x.replace(/\n/g,'<br>');document.getElementById('modal').classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ============ СТАРТ ============
loadTheme();
startScanner();
</script>
